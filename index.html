<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulipsu - Grade 4 Chapter 1 - Shapes Around Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME
   ========================================================= */
:root{
  --ink:#2b2d42; --ink2:#5b5f7a; --cream:#fff8e7; --sky:#d8f0ff;
  --orange:#ff8a3d; --orange-d:#d96a1f; --yellow:#ffd23f; --yellow-d:#d9a900;
  --blue:#3ea6ff; --blue-d:#1d7fd6; --green:#3ccf91; --green-d:#1f9f6c;
  --purple:#8f6bff; --purple-d:#6544d6; --red:#ff5d5d; --line:#e6dfc8;
}
*{box-sizing:border-box}
svg{display:block}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;color:var(--ink);background:#bfe6ff;-webkit-user-select:none;user-select:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#bfe6ff,#fff3d0)}

/* =========================================================
   FIXED 1920 x 1080 STAGE  (header 88 | instruction 130 | work 766 | footer 96)
   ========================================================= */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,#f3fbff 40%,var(--cream) 100%);font-size:28px;line-height:1.3}
/* shell zones per CT-1104: header 0-120, content 120-960 (instruction bar 128 + work area 712), footer 960-1080 */
#bgshapes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#bgshapes span{position:absolute;top:0;opacity:.3;animation:drift 22s linear infinite}
#bgshapes .c{width:70px;height:70px;border-radius:50%;background:var(--yellow)}
#bgshapes .s{width:60px;height:60px;border-radius:12px;background:#ff6fa5}
#bgshapes .t{width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-bottom:62px solid var(--blue)}
@keyframes drift{0%{transform:translateY(1120px) rotate(0)}100%{transform:translateY(-140px) rotate(360deg)}}
#hdr{position:absolute;left:0;top:0;width:1920px;height:120px;background:#fff;border-bottom:5px solid var(--yellow);display:flex;align-items:center;gap:20px;padding:0 28px}
#ins{position:absolute;left:0;top:120px;width:1920px;height:128px;background:#fff8d6;border-bottom:5px solid var(--yellow);display:flex;align-items:center;gap:20px;padding:0 24px}
#work{position:absolute;left:0;top:248px;width:1920px;height:712px;padding:14px 16px}
#foot{position:absolute;left:0;top:960px;width:1920px;height:120px;background:#fff;border-top:5px solid var(--yellow);display:flex;align-items:center;gap:20px;padding:0 32px}
#stage.noins #ins{display:none}
#stage.noins #work{top:120px;height:840px}

/* header: class name, progress, sound, help, logo top-right (CT-1104) */
.brand{width:430px;flex:none}
.brand .bt1{font-weight:700;font-size:34px;line-height:40px;white-space:nowrap}
.brand .bt2{font-size:28px;line-height:34px;color:var(--ink2);white-space:nowrap}
#prog{flex:1;min-width:0;display:flex;gap:10px;justify-content:center}
#prog span{font-size:28px;line-height:34px;font-weight:600;border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 20px;color:var(--ink2);white-space:nowrap}
#prog span.on{background:var(--blue);border-color:var(--blue-d);color:#fff}
#prog span.ok{background:#e9f9f1;border-color:var(--green);color:var(--green-d)}
.tools{display:flex;align-items:center;gap:12px;flex:none}
.coins{background:#fff8d6;border:3px solid var(--yellow-d);border-radius:999px;padding:6px 20px;font-weight:700;font-size:28px;line-height:34px;white-space:nowrap}
.coins.pulse{animation:pulse .45s}
@keyframes pulse{50%{transform:scale(1.15)}}
.ibtn{height:64px;border-radius:16px;border:3px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:28px;cursor:pointer;flex:none;padding:0 22px;white-space:nowrap}
.ibtn.off{opacity:.55}
.hlogo{height:64px;width:auto;flex:none;display:block;margin-left:8px}

/* instruction bar (what to do NOW) */
.iface{width:104px;height:104px;border-radius:50%;background:#fff url(assets/img/tara.png) -33px 4px/170px 170px no-repeat;border:5px solid var(--ink);overflow:hidden;flex:none}
.iface svg{width:100%;height:100%;display:block}
.ibub{flex:1;min-width:0;height:104px;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:10px 24px;display:flex;flex-direction:column;justify-content:center;position:relative}
.ibub::before{content:"";position:absolute;left:-20px;top:36px;border:13px solid transparent;border-left:0;border-right:18px solid var(--ink)}
.ibub::after{content:"";position:absolute;left:-13px;top:40px;border:9px solid transparent;border-left:0;border-right:13px solid #fff}
.it1{font-size:33px;line-height:40px;font-weight:700;white-space:nowrap;overflow:hidden}
.it2{font-size:28px;line-height:30px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.it2.good{color:var(--green-d);font-weight:600}.it2.try{color:var(--orange-d);font-weight:600}
.ipill{width:240px;height:104px;flex:none;background:#fff;border:4px solid var(--orange);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ipill .p1{font-size:28px;color:var(--ink2);font-weight:600;white-space:nowrap;line-height:24px}
.ipill .p2{font-size:30px;color:var(--orange-d);font-weight:700;white-space:nowrap;line-height:36px}
.ipill.done{border-color:var(--green)}.ipill.done .p2{color:var(--green-d)}

/* footer */
.fb{flex:1;min-width:0;height:96px;display:flex;align-items:center;gap:12px;font-size:28px;line-height:36px;padding:0 16px;border-radius:18px}
.fb .fbt{overflow:hidden;max-height:76px}
.fb.good{background:#e9f9f1;color:var(--green-d);font-weight:600}
.fb.try{background:#fff1e6;color:var(--orange-d);font-weight:600}
.fb.info{background:#eef8ff;color:var(--blue-d);font-weight:600}
.fb .fbi{font-size:34px;line-height:42px;height:42px;flex:none}

/* buttons */
.btn{font:inherit;font-weight:700;font-size:28px;color:#fff;background:var(--blue);border:0;border-radius:18px;padding:10px 24px;cursor:pointer;box-shadow:0 6px 0 var(--blue-d);white-space:nowrap;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--blue-d)}
.btn.orange{background:var(--orange);box-shadow:0 6px 0 var(--orange-d)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.btn.purple{background:var(--purple);box-shadow:0 6px 0 var(--purple-d)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 6px 0 var(--yellow-d)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.sm{font-size:28px;padding:6px 16px;border-radius:14px}
.btn.big{font-size:32px;padding:12px 34px;border-radius:22px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.pulse-btn{animation:wob 1s infinite}
@keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* guidance: glow = touch this next, lock = not yet */
.hl{animation:glow 1.1s infinite;border-color:var(--orange)!important}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.85)}50%{box-shadow:0 0 0 10px rgba(255,138,61,0)}}
.svghl{animation:sglow 1.1s infinite}
@keyframes sglow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,138,61,0))}50%{filter:drop-shadow(0 0 8px rgba(255,138,61,1))}}
.lock{opacity:.35;pointer-events:none;filter:grayscale(.6)}
#stage.audit *{animation:none!important;transition:none!important}

/* panels */
.pn{background:#fffdf4;border:4px dashed var(--line);border-radius:24px;padding:12px 16px;overflow:hidden;min-width:0;min-height:0}
.pt{font-size:28px;line-height:34px;font-weight:700;margin:0 0 8px;white-space:nowrap}
.note{font-size:28px;line-height:27px;color:var(--ink2)}
.chip{display:inline-block;border:3px solid var(--line);background:#fff;border-radius:999px;padding:1px 14px;font-weight:600;font-size:28px;line-height:30px;margin:3px 6px 3px 0;white-space:nowrap}
.chip.ok{background:#e9f9f1;border-color:var(--green)}
.chip.now{background:#fff1e6;border-color:var(--orange)}
.vb{background:radial-gradient(circle at 50% 40%,#fff,#eaf6ff);border:4px solid var(--blue);border-radius:24px;touch-action:none;cursor:grab;overflow:hidden}
.vb svg{display:block;width:100%;height:100%}
table.t{border-collapse:collapse;width:100%;font-size:28px;line-height:28px}
table.t th,table.t td{border:3px solid var(--line);padding:3px 10px;text-align:center;white-space:nowrap}
table.t th{background:#fff8d6}
table.t tr.hl2 td{background:#e9f9f1;font-weight:700}
input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--orange);display:block}
.rb{display:flex;gap:10px;justify-content:center}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.ghost{fill:rgba(62,166,255,.1);stroke:#3ea6ff;stroke-width:2.5;stroke-dasharray:6 5;cursor:pointer}
.float{position:absolute;z-index:200;pointer-events:none;font-weight:700;font-size:32px;background:var(--yellow);border:4px solid var(--yellow-d);border-radius:999px;padding:2px 18px;animation:fl 1s ease-out forwards}
@keyframes fl{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-100px);opacity:0}}

/* modal */
#modal{position:absolute;inset:0;background:rgba(43,45,66,.6);z-index:150;display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
#modal .box{background:#fff;border:6px solid var(--ink);border-radius:32px;width:980px;padding:28px 44px;text-align:center}
#modal .mi{font-size:78px;line-height:96px}
#modal h3{font-size:42px;line-height:52px;margin:4px 0 12px}
#modal .mb{font-size:28px;line-height:38px;text-align:left;margin:0 0 22px}

/* =========================================================
   GUIDE CHARACTER (Tara) + COACH OVERLAY
   ========================================================= */
.tara .mo{opacity:0}
.talk .tara .mc{animation:mA .3s steps(1) infinite}
.talk .tara .mo{animation:mB .3s steps(1) infinite}
@keyframes mA{50%{opacity:0}} @keyframes mB{0%{opacity:0}50%{opacity:1}}
.tara .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
#coach{position:absolute;inset:0;z-index:120;pointer-events:none}
#coach .shade{position:absolute;inset:0;background:rgba(10,14,22,.74);opacity:0;transition:opacity .3s;pointer-events:auto}
#coach.on .shade{opacity:1} #coach.off .shade{opacity:0}
.tpng{width:100%;height:100%;object-fit:contain;display:block}
.tface{width:170px;height:170px;max-width:none;margin:4px 0 0 -33px;display:block}
.homerow .tbig{width:300px;height:354px}
#coach .who{position:absolute;left:-30px;bottom:-262px;width:540px;height:540px;transform:translateX(-130%);filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
#coach .who svg{width:100%;height:100%;display:block}
#coach.on .who{animation:sneak .6s ease-out forwards}
#coach.on.idle .who{transform:none;animation:bob 3.2s ease-in-out infinite}
#coach.off .who{animation:sneakOut .4s ease-in forwards}
@keyframes sneak{0%{transform:translateX(-130%) rotate(-8deg)}60%{transform:translateX(-20%) rotate(4deg)}100%{transform:none}}
@keyframes sneakOut{0%{transform:none}100%{transform:translateX(-140%) rotate(6deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
#stage.coaching .tools,#stage.coaching #foot>*{visibility:hidden}
#coach .say{position:absolute;left:420px;bottom:40px;width:max-content;min-width:760px;max-width:1330px;min-height:150px;background:#fff;border:6px solid #24405f;border-radius:36px;padding:20px 30px;display:flex;align-items:center;gap:24px;pointer-events:auto;opacity:0;transform:scale(.85);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.3)}
#coach .say.show{opacity:1;transform:none}
#coach .say::before{content:"";position:absolute;left:-34px;bottom:44px;border:20px solid transparent;border-left:0;border-right:30px solid #24405f}
#coach .say::after{content:"";position:absolute;left:-22px;bottom:50px;border:14px solid transparent;border-left:0;border-right:22px solid #fff}
#coach .nm{position:absolute;left:30px;top:-24px;background:var(--orange);color:#fff;font-weight:700;font-size:28px;line-height:34px;padding:4px 20px;border-radius:999px;border:4px solid #24405f;white-space:nowrap}
#coach .tx{flex:1;min-width:0;font-size:38px;line-height:48px;font-weight:600}
#coach .tx .h{visibility:hidden}
#coach .nxt{flex:none;font:inherit;font-weight:700;font-size:32px;color:#fff;background:#e4572e;border:4px solid #d96a1c;border-radius:999px;padding:8px 30px;cursor:pointer;box-shadow:0 5px 0 #a93c1a;visibility:hidden;opacity:0;white-space:nowrap}
#coach .nxt.ready{visibility:visible;opacity:1;animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
#coach .skip{position:absolute;right:34px;top:16px;font:inherit;font-weight:700;font-size:28px;height:64px;padding:0 26px;border-radius:999px;border:5px solid #fff;background:#e4572e;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);pointer-events:auto;white-space:nowrap}
.cspot{position:relative;z-index:130;outline:7px solid #ffc93c;outline-offset:4px;animation:spot 1s ease-in-out infinite}
@keyframes spot{50%{outline-color:#ff8a3d}}
#hand{position:absolute;left:0;top:0;width:150px;height:150px;z-index:140;pointer-events:none;opacity:0}
#hand img,#hand svg{width:100%;height:100%;display:block;mix-blend-mode:multiply;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}

/* =========================================================
   SCREENS
   ========================================================= */
/* home / end */
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px}
.center h1{font-size:92px;line-height:110px;margin:0}.center h1 span{color:var(--orange)}
.center p.lead{font-size:32px;line-height:42px;width:1300px;margin:0;color:var(--ink2)}
.homerow{display:flex;align-items:flex-end;gap:40px}
.homerow .tbig{width:230px;height:354px}
.how3{display:grid;grid-template-columns:repeat(3,500px);gap:24px}
.how3 div{background:#fff8d6;border:4px solid var(--yellow);border-radius:24px;padding:14px 20px;font-size:28px;line-height:32px;text-align:left;height:140px;overflow:hidden}
.how3 b:first-child{display:block;font-size:29px;line-height:36px}
.learn{display:grid;grid-template-columns:repeat(4,430px);gap:20px}
.learn div{background:#fff;border:4px solid var(--green);border-radius:22px;padding:10px 16px;font-size:28px;line-height:28px;text-align:left;height:150px;overflow:hidden}
.learn b:first-child{display:block;font-size:28px;line-height:32px}
/* story */
.story{display:grid;grid-template-columns:420px 1fr;gap:24px;height:100%}
.sp1{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:24px}
.bigav{width:180px;height:180px;border-radius:50%;background:var(--yellow);border:6px solid var(--ink);display:grid;place-items:center;font-size:100px;line-height:1}
.sname{font-size:34px;line-height:42px;font-weight:700;white-space:nowrap}
.splace{font-size:28px;line-height:32px;color:var(--ink2);white-space:nowrap}
.trail{display:flex;gap:4px;font-size:28px;line-height:40px;margin-top:10px}
.trail span{opacity:.3}.trail span.v{opacity:1}
.sp2{display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0;min-width:0}
.speech{background:#eef8ff;border:5px solid var(--blue);border-radius:28px;padding:20px 28px;font-size:31px;line-height:42px;height:240px;overflow:hidden}
.speech b{color:var(--orange-d)}
.shapes{display:flex;gap:40px;font-size:84px;line-height:100px}.shapes{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.card1{background:#fff;border:5px solid var(--ink);border-radius:32px;padding:24px 48px}
.lesson{background:#fff;border:5px solid var(--green);border-radius:28px;padding:20px 30px;font-size:34px;line-height:46px;height:250px;overflow:hidden}
.speech.sm{height:182px;font-size:29px;line-height:38px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:10px}
.choice{font:inherit;text-align:left;border:5px solid var(--ink);background:#fff;border-radius:28px;padding:16px 24px;cursor:pointer;display:flex;gap:18px;align-items:center;font-weight:600;font-size:31px;line-height:40px;height:190px;box-shadow:0 7px 0 rgba(43,45,66,.2);overflow:hidden}
.choice .ic{font-size:64px;line-height:80px;flex:none}
.choices.one{grid-template-columns:1fr;width:720px}
.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.brief div{border-radius:24px;padding:14px 20px;border:5px solid;font-size:28px;line-height:31px;height:340px;overflow:hidden}
.brief b:first-child{display:block;font-size:28px;line-height:36px;margin-bottom:4px}
.brief .why{background:#fff1e6;border-color:var(--orange)}.brief .what{background:#e9f9f1;border-color:var(--green)}.brief .where{background:#f1ebff;border-color:var(--purple)}
/* M1 */
.m1g{display:grid;grid-template-columns:430px 790px 620px;gap:24px;height:100%}
.pile .it{display:flex;align-items:center;gap:10px;width:100%;font:inherit;background:#fff;border:4px solid var(--line);border-radius:18px;padding:4px 10px;margin-bottom:10px;cursor:pointer;font-weight:600;font-size:28px;line-height:28px;text-align:left;height:90px}
.pile .it svg{width:82px;height:72px;flex:none}
.shelf{background:#fff;border:4px solid var(--line);border-radius:18px;padding:6px 12px;height:306px;overflow:hidden}
.shelf+.shelf{margin-top:14px}
.shelf h5{margin:0 0 2px;font-size:28px;line-height:34px;white-space:nowrap}
.got{display:flex;align-items:center;gap:8px;font-size:28px;line-height:36px;font-weight:600;height:80px}
.got svg{width:80px;height:72px;flex:none}
.shelf.s2{border-color:var(--green)}.shelf.s3{border-color:var(--purple)}
.turnbox{border:4px solid var(--line);border-radius:16px;padding:6px 14px}
.turnbox .tl{font-size:28px;line-height:32px;font-weight:600;white-space:nowrap}
/* M2 */
.m2g{display:grid;grid-template-columns:1120px 1fr;gap:24px;height:100%}
.dpad{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,64px);gap:8px}
.dpad .btn{padding:0;font-size:30px;width:84px;height:64px}
/* M3 */
.m3g{display:grid;grid-template-columns:760px 1fr;gap:24px;height:100%}
/* M4 */
.m4g{display:grid;grid-template-columns:560px 640px 640px;gap:24px;height:100%}
.stepcard{display:flex;gap:12px;align-items:center;width:100%;font:inherit;font-weight:600;font-size:28px;line-height:29px;background:#fff;border:4px solid var(--purple);border-radius:20px;padding:8px 14px;margin-bottom:12px;cursor:pointer;text-align:left;height:190px;overflow:hidden}
.stepcard .ic{font-size:42px;line-height:56px;flex:none}
.stepcard small{display:block;font-size:28px;line-height:25px;font-weight:500;color:var(--ink2);margin-top:4px}
.slot{height:150px;border:4px dashed var(--purple);border-radius:20px;padding:6px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;background:#faf6ff;font-weight:600;font-size:28px;line-height:29px;cursor:pointer;overflow:hidden}
.slot.f{border-style:solid;background:#efe8ff}
.slot.run{background:#fff8d6;border-color:var(--yellow-d)}.slot.okk{background:#e9f9f1;border-color:var(--green)}.slot.bad{background:#ffe5e5;border-color:var(--red)}
.sn{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;flex:none;font-size:28px}
.slot .sic{font-size:36px;line-height:48px;flex:none}
.mem{background:#1f2140;color:#d7f7e6;border-radius:18px;padding:12px 16px;font-family:Consolas,monospace;font-size:28px;line-height:36px;height:262px;overflow:hidden}
.mem div{margin-bottom:6px}
/* stations */
.m5a{display:grid;grid-template-columns:470px 920px 450px;gap:24px;height:100%}
.cellgrid{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center}
.cell{font:inherit;font-weight:700;width:76px;height:76px;border:4px solid var(--line);background:#f6ecd0;border-radius:14px;cursor:pointer;font-size:30px;color:var(--ink);padding:0}
.cell.k0{background:#e6e6f2}.cell.k1{background:#cdeeff}.cell.k2{background:#ffe08a}.cell.k3{background:#ffb199}
.cell.cur{outline:5px solid var(--purple);outline-offset:-2px}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.layers .pn{height:350px}
.m5b{display:grid;grid-template-columns:800px 1fr;gap:24px;height:100%}

<body>
<div id="viewport"><div id="stage">

<script>
'use strict';
/* =====================================================================
   BASICS: stage scaling, state, sound, coins
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const D2R=Math.PI/180, STG=$('#stage');
const S={done:{},awarded:{},screen:'home',sfx:false,coachSeen:{}}; /* sound effects are muted by default (CT-1107) */
let scale=1;
function fit(){ scale=Math.min(innerWidth/1920,innerHeight/1080); STG.style.transform=`translate(-50%,-50%) scale(${scale})`; }
addEventListener('resize',fit); fit();
let lastPt={x:960,y:500};
function toStage(cx,cy){ const r=STG.getBoundingClientRect(); return {x:(cx-r.left)/scale,y:(cy-r.top)/scale}; }
addEventListener('pointerdown',e=>{ lastPt=toStage(e.clientX,e.clientY); armIdle(); },true);

let actx=null;
function beep(type){ if(!S.sfx) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime; o.connect(g); g.connect(actx.destination);
  if(type==='ok'){o.type='triangle';o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(880,t+.15);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.start();o.stop(t+.3);}
  else if(type==='no'){o.type='sine';o.frequency.setValueAtTime(260,t);o.frequency.setValueAtTime(200,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.start();o.stop(t+.3);}
  else{o.type='sine';o.frequency.setValueAtTime(988,t);o.frequency.setValueAtTime(1318,t+.07);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);o.start();o.stop(t+.2);} }catch(e){} }
function addCoins(){} /* no live points on screen (CT-904): progress is shown as badges */
function award(){ return true; }
function confetti(){ const cols=['#ff8a3d','#ffd23f','#3ea6ff','#3ccf91','#8f6bff','#ff6fa5'];
  for(let i=0;i<40;i++){ const d=document.createElement('div'); d.style.cssText=`position:absolute;z-index:300;width:16px;height:16px;border-radius:${i%2?'50%':'4px'};background:${cols[i%6]};left:${960+Math.random()*700-350}px;top:560px;transition:all 1s ease-out;pointer-events:none`;
    STG.appendChild(d); setTimeout(()=>{d.style.transform=`translate(${Math.random()*500-250}px,${-Math.random()*400-60}px) rotate(${Math.random()*720}deg)`;d.style.opacity=0;},20); setTimeout(()=>d.remove(),1100);} }
let modalCb=null;
function modal({icon='🎉',title='',msg='',ok='OK',cb=null}){
  $('#modalBox').innerHTML=`<div class="mi">${icon}</div><h3>${title}</h3><div class="mb">${msg}</div><button class="btn orange big" id="mOk">${ok}</button>`;
  $('#modal').classList.add('show'); hideHand(); modalCb=cb; $('#mOk').onclick=()=>{ closeModal(); const c=modalCb; modalCb=null; if(c) c(); armIdle(2500); }; }
function closeModal(){ $('#modal').classList.remove('show'); }
const modalOpen=()=>$('#modal').classList.contains('show');

/* =====================================================================
   TARA — the guide character (inline SVG, mouth moves while she talks)
   ===================================================================== */
const SKIN='#a86b3c', HAIR='#2b1b17';
const TARA_HEAD=`
 <circle cx="66" cy="118" r="24" fill="${HAIR}"/><circle cx="194" cy="118" r="24" fill="${HAIR}"/>
 <circle cx="84" cy="100" r="7" fill="#ff6fa5"/><circle cx="176" cy="100" r="7" fill="#ff6fa5"/>
 <circle cx="130" cy="128" r="62" fill="${HAIR}"/>
 <circle cx="77" cy="142" r="11" fill="${SKIN}"/><circle cx="183" cy="142" r="11" fill="${SKIN}"/>
 <circle cx="130" cy="140" r="53" fill="${SKIN}"/>
 <path d="M80 122 Q92 100 130 100 Q168 100 180 122 Q160 110 130 112 Q100 110 80 122 Z" fill="${HAIR}"/>
 <path d="M72 108 Q72 50 130 48 Q188 50 188 108 Z" fill="#ffd23f"/>
 <rect x="60" y="100" width="140" height="16" rx="8" fill="#ffc21a"/>
 <path d="M130 50 V100" stroke-width="3" fill="none"/>
 <rect x="142" y="68" width="20" height="20" rx="3" fill="#ff8a3d" stroke-width="3"/>
 <path d="M98 126 q12 -8 24 0 M138 126 q12 -8 24 0" fill="none" stroke-width="4"/>
 <g class="eyes"><ellipse cx="110" cy="146" rx="11" ry="13" fill="#fff" stroke-width="3"/><ellipse cx="150" cy="146" rx="11" ry="13" fill="#fff" stroke-width="3"/>
   <circle cx="112" cy="148" r="7" fill="#2b2d42" stroke="none"/><circle cx="152" cy="148" r="7" fill="#2b2d42" stroke="none"/>
   <circle cx="114.5" cy="145" r="2.6" fill="#fff" stroke="none"/><circle cx="154.5" cy="145" r="2.6" fill="#fff" stroke="none"/></g>
 <circle cx="96" cy="166" r="8" fill="#ff8fa3" stroke="none" opacity=".75"/><circle cx="164" cy="166" r="8" fill="#ff8fa3" stroke="none" opacity=".75"/>
 <path d="M128 154 q5 5 0 9" fill="none" stroke-width="3"/>
 <path class="mc" d="M114 172 Q130 190 146 172 Q130 180 114 172 Z" fill="#b3283b" stroke-width="3"/>
 <g class="mo"><ellipse cx="130" cy="178" rx="12" ry="10" fill="#b3283b" stroke-width="3"/><ellipse cx="130" cy="183" rx="7" ry="3.5" fill="#ff8fa3" stroke="none"/></g>`;
const TARA_BODY=`
 <path d="M96 228 L64 188" stroke="#2b2d42" stroke-width="30" fill="none"/><path d="M96 228 L64 188" stroke="#3ea6ff" stroke-width="22" fill="none"/>
 <path d="M64 188 L52 150" stroke="#2b2d42" stroke-width="24" fill="none"/><path d="M64 188 L52 150" stroke="${SKIN}" stroke-width="16" fill="none"/>
 <circle cx="50" cy="138" r="15" fill="${SKIN}"/>
 <rect x="100" y="320" width="24" height="56" fill="${SKIN}"/><rect x="136" y="320" width="24" height="56" fill="${SKIN}"/>
 <rect x="88" y="368" width="42" height="28" rx="11" fill="#e24b4b"/><rect x="132" y="368" width="42" height="28" rx="11" fill="#e24b4b"/>
 <polygon points="186,240 250,322 186,322" fill="#9fd4ff"/><polygon points="198,272 222,306 198,306" fill="#fff8e7"/>
 <rect x="86" y="206" width="88" height="74" rx="26" fill="#3ea6ff"/>
 <path d="M92 256 H168 L176 330 H84 Z" fill="#ff8a3d"/>
 <rect x="104" y="232" width="52" height="34" rx="6" fill="#ff8a3d"/>
 <path d="M106 236 L100 210 M154 236 L160 210" stroke="#2b2d42" stroke-width="13" fill="none"/><path d="M106 236 L100 210 M154 236 L160 210" stroke="#ff8a3d" stroke-width="6" fill="none"/>
 <circle cx="108" cy="240" r="5" fill="#ffd23f" stroke-width="2.5"/><circle cx="152" cy="240" r="5" fill="#ffd23f" stroke-width="2.5"/>
 <rect x="117" y="242" width="26" height="18" rx="4" fill="#ffb36b" stroke-width="3"/><path d="M124 256 L130 246 L136 256 Z" fill="#3ea6ff" stroke-width="2"/>
 <path d="M130 300 V330" stroke-width="3" fill="none"/>
 <path d="M164 228 L196 264" stroke="#2b2d42" stroke-width="30" fill="none"/><path d="M164 228 L196 264" stroke="#3ea6ff" stroke-width="22" fill="none"/>
 <path d="M196 264 L204 296" stroke="#2b2d42" stroke-width="24" fill="none"/><path d="M196 264 L204 296" stroke="${SKIN}" stroke-width="16" fill="none"/>
 <circle cx="205" cy="304" r="15" fill="${SKIN}"/>
 <rect x="118" y="180" width="24" height="30" fill="${SKIN}"/>`;
const taraSVG=(vb='0 0 260 400')=>`<svg class="tara" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><g stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${vb==='0 0 260 400'?TARA_BODY:''}${TARA_HEAD}</g></svg>`;
/* generated art (agy): assets/img/tara.png (full body, transparent) and assets/img/hand.png; the inline SVG above stays as an offline fallback */
const TARA_FULL=`<img class="tpng" src="assets/img/tara.png" alt="" onerror="this.outerHTML=taraSVG()">`, TARA_FACE=`<img class="tface" src="assets/img/tara.png" alt="" onerror="this.outerHTML=taraSVG('46 42 168 168')">`;
const HAND_SVG=`<svg viewBox="0 0 100 130"><g stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
 <ellipse cx="24" cy="74" rx="10" ry="17" transform="rotate(-24 24 74)" fill="#ffd6b0"/>
 <rect x="22" y="50" width="62" height="58" rx="20" fill="#ffd6b0"/>
 <path d="M62 60 v16 M74 62 v14" stroke-width="3" fill="none"/>
 <rect x="38" y="4" width="22" height="66" rx="11" fill="#ffd6b0"/>
 <rect x="28" y="102" width="50" height="24" rx="6" fill="#3ea6ff"/></g></svg>`;
$('#hand').innerHTML=`<img src="assets/img/hand.png" alt="" onerror="this.parentNode.innerHTML=HAND_SVG">`;

/* =====================================================================
   VOICE (device speech; silent timing when off or unavailable)
   ===================================================================== */
const Voice={on:true,tok:0,t:0,
  pick(){ try{ const v=speechSynthesis.getVoices()||[],en=v.filter(x=>/^en/i.test(x.lang)); return en.find(x=>/en[-_]IN/i.test(x.lang))||en.find(x=>/Zira|Aria|Jenny|Samantha|Female/i.test(x.name))||en[0]||null; }catch(e){ return null; } },
  speak(html,onEnd){ const my=++this.tok; let done=false; const text=html.replace(/<[^>]+>/g,' ').replace(/[“”]/g,'').replace(/\s+/g,' ').trim(), est=Math.max(1600,text.length*62+900);
    const fin=()=>{ if(done||my!==this.tok) return; done=true; clearTimeout(this.t); if(onEnd) onEnd(); };
    let active=true; try{ active=navigator.userActivation?navigator.userActivation.hasBeenActive:true; }catch(e){}
    if(!this.on||!active||!window.speechSynthesis||!window.SpeechSynthesisUtterance){ this.t=setTimeout(fin,Math.min(est,2600)); return; }
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text),v=this.pick(); if(v) u.voice=v; u.lang=(v&&v.lang)||'en-IN'; u.rate=.95; u.pitch=1.12; u.onend=u.onerror=fin; speechSynthesis.speak(u); this.t=setTimeout(fin,est*1.8+2500); }
    catch(e){ this.t=setTimeout(fin,est); } },
  stop(){ this.tok++; clearTimeout(this.t); try{ speechSynthesis.cancel(); }catch(e){} } };
try{ speechSynthesis.getVoices(); }catch(e){}

/* =====================================================================
   COACH: Tara walks in, tells the situation line by line, then leaves.
   Everything underneath is locked while she talks. Skip is always available.
   ===================================================================== */
const Coach={act:false,r:null,tm:0,
  play(lines,done){ this.stop(); Voice.stop(); this.act=true; this.done=done; hideHand(); const text=[].concat(lines).join(' ');
    const r=document.createElement('div'); r.id='coach';
    r.innerHTML='<div class="shade"></div><div class="who">'+TARA_FULL+'</div><div class="say"><div class="nm">Tara the Builder</div><div class="tx"></div></div><button class="skip">Skip</button>';
    STG.appendChild(r); this.r=r; setInert(true); r.querySelector('.skip').onclick=()=>this.leave();
    setTimeout(()=>{ if(this.r!==r) return; r.classList.add('on'); setTimeout(()=>{ if(this.r!==r) return; r.classList.add('idle'); r.querySelector('.tx').textContent=text; r.querySelector('.say').classList.add('show');
      Voice.speak(text,()=>{ if(this.r===r) this.tm=setTimeout(()=>this.leave(),600); }); },650); },30); },
  leave(){ if(!this.r) return; clearTimeout(this.tm); Voice.stop(); const r=this.r; r.classList.add('off'); this.r=null;
    setTimeout(()=>{ r.remove(); this.act=false; setInert(false); const d=this.done; this.done=null; if(d) d(); },420); },
  stop(){ clearTimeout(this.tm); if(this.r){ this.r.remove(); this.r=null; } if(this.act){ this.act=false; setInert(false); } } };
function setInert(on){ ['#hdr','#ins','#work','#foot'].forEach(s=>{ const e=$(s); if(on) e.setAttribute('inert',''); else e.removeAttribute('inert'); }); STG.classList.toggle('coaching',!!on); }
function coach(id,lines,after){ if(S.coachSeen[id]){ if(after) after(); return; } S.coachSeen[id]=true; Coach.play(lines,after); }

/* =====================================================================
   POINTING HAND: shows what to touch. Comes back if the child waits.
   ===================================================================== */
let handAnim=null, idleT=0;
function hideHand(){ try{ if(handAnim) handAnim.cancel(); }catch(e){} handAnim=null; $('#hand').style.opacity=0; }
function targetEl(){ const sel=G.target; let e=typeof sel==='string'?$(sel):sel; if(!e) e=$('#work .hl, #work .svghl'); if(!e){ const n=$('#fNext'); if(n&&!n.disabled) e=n; } return e; }
/* the hand performs the real gesture: a slider is dragged, anything else is tapped */
function cue(){ hideHand(); if(Coach.act||modalOpen()) return; const e=targetEl(); if(!e) return; const sl=e.matches&&e.matches('input[type=range]')?e:(e.querySelector?e.querySelector('input[type=range]'):null); const r=(sl||e).getBoundingClientRect(); if(!r.width) return;
  const h=$('#hand'); let pts;
  if(sl){ const mn=+sl.min||0,mx=+sl.max||100,tg=G.dragTo!=null?G.dragTo:mx,f=v=>.03+.94*(v-mn)/(mx-mn); pts=[toStage(r.left+r.width*f(+sl.value),r.top+r.height/2),toStage(r.left+r.width*f(tg),r.top+r.height/2)]; }
  else pts=[toStage(r.left+r.width/2,r.top+r.height/2)];
  const low=Math.max(...pts.map(p=>p.y))>800;
  const tf=(p,s)=>low?`translate(${p.x-62}px,${p.y-130}px) rotate(180deg) scale(${s})`:`translate(${p.x-60}px,${p.y-20}px) scale(${s})`;
  const a=pts[0],b=pts[pts.length-1];
  const fr=sl?[{transform:tf(a,1),opacity:0,offset:0},{transform:tf(a,1),opacity:1,offset:.12},{transform:tf(a,.82),opacity:1,offset:.22},{transform:tf(b,.82),opacity:1,offset:.7},{transform:tf(b,1),opacity:1,offset:.8},{transform:tf(b,1),opacity:0,offset:1}]
    :[{transform:tf(a,1),opacity:0},{transform:tf(a,1),opacity:1,offset:.2},{transform:tf(a,.82),opacity:1,offset:.45},{transform:tf(a,1),opacity:1,offset:.7},{transform:tf(a,1),opacity:0}];
  h.style.transformOrigin=low?'50% 50%':'49% 3%';
  try{ handAnim=h.animate(fr,{duration:sl?2600:1300,iterations:2,easing:'ease-in-out'}); handAnim.onfinish=hideHand; }catch(err){} }
function armIdle(ms=8000){ clearTimeout(idleT); idleT=setTimeout(()=>{ cue(); armIdle(10000); },ms); }

/* =====================================================================
   GUIDED FRAME — one instruction at a time, read aloud, hand points
   ===================================================================== */
const G={text:null,target:null};
/* the five classes of the ASK (CT-102): Ci, C1, C2, Cc, Assessment. Assessment is not built yet. */
const CLASSES=[['Ci','Introduction',['problem','story','m1'],'m1'],['C1','Class 1',['m2','m3'],'m3'],['C2','Class 2',['m4','a','b'],'b'],['Cc','Conclusion',['c','d'],'d']];
function updateProg(){ const cur=CLASSES.findIndex(c=>c[2].includes(S.screen));
  $('#prog').innerHTML=CLASSES.map((c,i)=>{ const dn=!!S.done[c[3]]; return `<span class="${i===cur?'on':(dn?'ok':'')}">${c[0]}${dn&&i!==cur?' ✓':''}</span>`; }).join('');
  $('#clsName').textContent=cur>=0?`Class ${CLASSES[cur][0]} · ${CLASSES[cur][1]}`:'Grade 4 · Chapter 1';
  const n=Object.keys(BADGES).filter(k=>S.done[k]).length; const el=$('#coinCount'); if(el&&el.textContent!==String(n)){ el.textContent=n; const bx=$('#badgeBox'); bx.classList.remove('pulse'); void bx.offsetWidth; bx.classList.add('pulse'); } }
function frame(withIns){ STG.classList.toggle('noins',!withIns); }
/* o: {p1, p2, text, sub, kind, target, done} */
function guide(o){
  $('#ins').innerHTML='<div class="iface" id="iface"></div><div class="ibub" id="ibub"><div class="it1">'+o.text+'</div><div class="it2 '+(o.kind||'')+'">'+(o.sub||'')+'</div></div><div class="ipill '+(o.done?'done':'')+'"><div class="p1">'+(o.p1||'')+'</div><div class="p2">'+(o.p2||'')+'</div></div>';
  G.target=o.target||null; G.dragTo=o.dragTo!=null?o.dragTo:null;
  hideHand(); clearTimeout(idleT); /* a step change never leaves an old hand or hint behind */
  if(o.text!==G.text){ G.text=o.text; fb(''); }
  armIdle();
}
function fb(text,kind='info'){ const e=$('#fbx'); if(!e) return; if(!text){ e.className='fb'; e.innerHTML=''; return; }
  e.className='fb '+kind; e.innerHTML='<span class="fbt">'+text+'</span>'; }
const RESET={
  problem(){}, story(){ ST.pick=null; },
  m1(){ Object.assign(M1,{i:0,ph:0,angle:0,placed:{}}); },
  m2(){ Object.assign(M2,{ph:0,read:[],bx:1,by:1,horiz:true,removed:[],locked:false}); },
  m3(){ Object.assign(M3,{ph:0,sel:[],saved:[]}); },
  m4(){ Object.assign(M4,{slots:[null,null,null],tray:[3,1,2],mem:{},running:false,state:['','',''],ok:false,fail:null}); },
  a(){ Object.assign(PA,{ph:0,seen:{},cur:null,turnFor:null}); },
  b(){ Object.assign(SB,{ph:0,marks:{f:new Set(),e:new Set(),v:new Set()},n:3,tried:{3:[4,6,4]},ok:false}); },
  c(){ Object.assign(SC,{ph:0,pos:50,log:[],picked:null}); },
  d(){ SD.removed=[]; } };
function goBack(){ const sc=S.screen;
  if(sc==='story'&&ST.i>0){ ST.i--; ST.pick=null; SCREENS.story(); return; }
  if(sc==='m1'){ ST.i=SCENES.length-1; ST.pick=null; }
  const i=FLOW.indexOf(sc); if(i>0) go(FLOW[i-1]); }
function restart(){ if(RESET[S.screen]){ RESET[S.screen](); G.text=null; Coach.stop(); SCREENS[S.screen](); } }
function setFoot({next=null,hint=true}){
  $('#foot').innerHTML=(hint?'<button class="btn ghost" id="fBack">◀ Back</button><button class="btn ghost" id="fRestart">↺ Restart</button>':'')+'<div class="fb" id="fbx"></div>'+(next?`<button class="btn orange big" id="fNext" ${next.on?'':'disabled'}>${next.label}</button>`:'');
  if(hint){ $('#fBack').onclick=()=>{ beep('pop'); goBack(); }; $('#fRestart').onclick=()=>{ beep('pop'); restart(); }; }
  if(next){ $('#fNext').onclick=()=>{ if(!next.on) return; beep('pop'); next.fn(); }; if(next.on) $('#fNext').classList.add('pulse-btn'); } }
let HINTS=[];
const FLOW=['home','problem','story','m1','m2','m3','m4','a','b','c','d','end'];
const SCREENS={};
function go(name){ destroyViewers(); Coach.stop(); Voice.stop(); hideHand(); closeModal(); G.text=null; S.screen=name; updateProg(); SCREENS[name](); }
function goNext(){ go(FLOW[FLOW.indexOf(S.screen)+1]); }
const BADGES={m1:'Shape Sorter',m2:'Block Subtractor',m3:'Triangle Finder',m4:'Step Planner',a:'Cube Painter',b:'Crate Counter',c:'Cake Slicer',d:'Tunnel Builder'};
/* one tap: the badge card carries the learner straight to the next screen (CT-421) */
function finish(key,_c,_n,_t,msg){ S.done[key]=true; updateProg(); beep('ok'); confetti(); const nx=FLOW[FLOW.indexOf(S.screen)+1];
  modal({icon:'🌟',title:'Badge earned: '+BADGES[key],msg,ok:nx==='end'?'Finish':'Next',cb:goNext}); }

/* =====================================================================
   3D MESH ENGINE (SVG) — turn with buttons or by dragging
   ===================================================================== */
function rotPt(p,rx,ry){ const [x,y,z]=p,cy=Math.cos(ry),sy=Math.sin(ry); const x1=x*cy+z*sy,z1=-x*sy+z*cy,cx=Math.cos(rx),sx=Math.sin(rx); return [x1,y*cx-z1*sx,y*sx+z1*cx]; }
function finalize(m){ const seen=new Set(),e=[]; m.f.forEach(f=>f.forEach((a,i)=>{const b=f[(i+1)%f.length],k=a<b?a+'-'+b:b+'-'+a; if(!seen.has(k)){seen.add(k);e.push([a,b]);}})); m.e=e; return m; }

  else { text='Keep only Top removed: tap the other removed faces back.'; sub='Removed faces show as dashed outlines.'; kind='try'; step=2; }
  const first=r.length===0;
  $('#work').innerHTML=`<div class="m5d"><div class="pn col" style="gap:12px"><div class="vb" id="dv" style="height:610px"></div>${ROTBTNS}</div>
   <div class="col"><div class="pn ${!first&&!done?'hl':''}" style="height:236px"><div class="pt">🧱 Faces: tap to remove or put back</div><div class="row2">${SDN.map((n,i)=>`<button class="btn ${r.includes(i)?'ghost':''} ${first&&i===4?'hl':''} ${done||(first&&i!==4)?'lock':''}" data-f="${i}" style="width:318px;font-size:28px">${r.includes(i)?'↩ '+n+' (off)':'🟦 '+n}</button>`).join('')}</div></div>
    <div class="pn" style="height:128px"><div style="font-size:38px;line-height:48px;font-weight:700">Faces left: <span style="color:var(--orange-d)">${6-r.length}</span></div><div class="note" style="font-size:28px;line-height:32px">6 faces − ${r.length} removed = ${6-r.length}</div></div>
    <div class="pn" style="height:150px"><div class="pt">👯 Opposite pairs (they never touch)</div><div style="white-space:nowrap">${[[4,5],[0,1],[2,3]].map(p=>`<span class="chip ${p.every(x=>r.includes(x))?'ok':''}">${SDN[p[0]]} ↔ ${SDN[p[1]]}</span>`).join('')}</div></div></div></div>`;
  const tog=i=>{ if(done) return; if(first&&i!==4){ beep('no'); fb('Start with the Top face.','try'); return; } const k=SD.removed.indexOf(i); if(k>=0) SD.removed.splice(k,1); else SD.removed.push(i); beep('pop'); SCREENS.d();
    const rr=SD.removed; if(rr.length===2&&SDPAIR[rr[0]]===rr[1]&&!S.done.d) finish('d','sd',50,'Tunnel built! +50 🪙','Removing one pair of opposite faces from 6 faces leaves <b>4 faces</b>: a square tube, open at both ends.'); };
  const cube=boxMesh(1.9,1.9,1.9);
  const v=new Viewer($('#dv'),{mesh:()=>cube,store:SD.view,onTap:(t,i)=>{ if(t==='f') tog(i); },opts:()=>({size:90,color:[62,166,255],tapF:true,hidden:new Set(SD.removed),ghost:true,faceFill:i=>[[255,138,61],[255,210,63],[60,207,145],[143,107,255],[255,111,165],[62,166,255]][i]})});
  hookRot(v,$('#work')); $$('[data-f]').forEach(b=>b.onclick=()=>tog(+b.dataset.f));
  setFoot({});
  guide({p1:'Class Cc',p2:done?'Done! ✓':`Step ${step} of 3`,done,text,sub,kind,target:first?'[data-f="4"]':null});
  coach('d',['Station D: Box-maker Rae needs a tunnel box.','A cube has 6 faces. They come in 3 opposite pairs.','You will remove 2 faces and count what is left.'],()=>armIdle(1500));
};

   <div class="learn"><div><b>📄 2D vs 3D</b>Flat = no height. Solid = has height. Turn it side-on to check.</div><div><b>➖ Subtraction</b>Blocks left = total blocks − overlapping blocks.</div><div><b>🔺 Triangles</b>A triangle splits into 4. A group is a triangle when its outline has 3 sides.</div><div><b>📝 Sequencing</b>List → picture → cross out and calculate.</div>
   <div><b>🎨 Painted cube</b>8 corners (3), 12 edges (2), 6 face-centres (1), 1 middle (0).</div><div><b>📦 Pyramid</b>A square base gives 5 faces, 8 edges and 5 vertices.</div><div><b>🍰 Cross-section</b>A flat cut of a cylinder, parallel to its base, is a circle.</div><div><b>🕳️ Tunnel box</b>Remove 1 opposite pair from 6 faces: 4 faces left.</div></div>
   <button class="btn orange big" id="again">↺ Play again</button></div>`;
  setFoot({hint:false}); $('#again').onclick=()=>location.reload();
  setTimeout(()=>Coach.play(['You did it! The Toy Fair is open!','You sorted, subtracted, split, planned, counted and cut shapes.','You are a real Shape Town builder!'],null),400);

/* CT-416: buttons carry text only. Emoji belong to the design, never to controls. */
const EMO=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
function cleanBtns(root){ root.querySelectorAll('button').forEach(b=>{ b.querySelectorAll('.ic').forEach(x=>x.remove()); const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT); let t; while((t=w.nextNode())){ const v=t.nodeValue.replace(EMO,''); if(v!==t.nodeValue) t.nodeValue=v.replace(/^\s+/,''); } }); }
/* icons and emoji stay in the interface (design choice) */
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(Coach.act) Coach.leave(); else if(modalOpen()){ const o=$('#mOk'); if(o) o.click(); } } });

/* =====================================================================
   LAYOUT AUDIT (developer check: nothing may overlap, spill or be clipped)
   ===================================================================== */
window.__audit=function(){
  STG.classList.add('audit'); const issues=[], sr=STG.getBoundingClientRect(), k=scale;
  const vis=e=>{ const cs=getComputedStyle(e); if(cs.display==='none'||cs.visibility==='hidden'||+cs.opacity===0) return false; return e.getClientRects().length>0; };
  const roots=['#hdr','#ins','#work','#foot'].map(s=>$(s)).filter(e=>e&&vis(e)); if($('#modal').classList.contains('show')){ roots.length=0; roots.push($('#modalBox')); }
  const name=e=>(e.id?'#'+e.id:e.tagName.toLowerCase()+(e.className&&typeof e.className==='string'?'.'+e.className.trim().split(/\s+/).join('.'):''))+' "'+(e.textContent||'').trim().slice(0,30)+'"';
  const all=[]; roots.forEach(r=>{ all.push(r); r.querySelectorAll('*').forEach(e=>all.push(e)); });
  // 1) overflow (HTML boxes)
  all.forEach(e=>{ if(e.closest('svg')||e.tagName==='INPUT'||!vis(e)) return; if(e.scrollWidth>e.clientWidth+1&&e.clientWidth>0) issues.push('overflow-x '+name(e)+' '+e.scrollWidth+'>'+e.clientWidth); if(e.scrollHeight>e.clientHeight+1&&e.clientHeight>0) issues.push('overflow-y '+name(e)+' '+e.scrollHeight+'>'+e.clientHeight); });
  // 2) leaf boxes overlapping each other (text, buttons, inputs, svg text)
  const leaves=all.filter(e=>{ if(!vis(e)) return false; if(e.tagName==='text') return true; if(e.closest('svg')) return false; if(['BUTTON','INPUT'].includes(e.tagName)) return true; return [...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()); }).map(e=>({e,r:e.getBoundingClientRect()}));
  for(let i=0;i<leaves.length;i++) for(let j=i+1;j<leaves.length;j++){ const a=leaves[i],b=leaves[j]; if(a.e.contains(b.e)||b.e.contains(a.e)) continue;
    const ox=Math.min(a.r.right,b.r.right)-Math.max(a.r.left,b.r.left), oy=Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top); if(ox>2&&oy>2) issues.push('overlap '+name(a.e)+' X '+name(b.e)); }
  // 3) outside the stage or clipped by a panel
  leaves.forEach(({e,r})=>{ if(r.left<sr.left-1||r.right>sr.right+1||r.top<sr.top-1||r.bottom>sr.bottom+1) issues.push('off-stage '+name(e));
    let p=e.parentElement; while(p&&p!==STG){ const cs=getComputedStyle(p); if(cs.overflow!=='visible'){ const pr=p.getBoundingClientRect(); if(r.left<pr.left-1||r.right>pr.right+1||r.top<pr.top-1||r.bottom>pr.bottom+1){ issues.push('clipped '+name(e)+' by '+name(p)); } break; } p=p.parentElement; } });
  STG.classList.remove('audit'); return [...new Set(issues)];
};
